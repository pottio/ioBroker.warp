# Dependabot will run on day 28 of each month at 03:57 (Europe/Berlin timezone)
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "57 3 28 * *"
    open-pull-requests-limit: 20
    assignees:
      - "pottio"
    versioning-strategy: "increase"
